<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casebound: lit 3D hardcover books in the browser</title>
    <meta name="description" content="A three.js library of hardcover books you can scroll, open and read: pages that turn like paper, a magnifier, light that follows the pointer. Every book is a few lines of data." />
    <meta name="theme-color" content="#e6e5de" />
    <link rel="canonical" href="https://othmanadi.github.io/casebound/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Casebound: lit 3D hardcover books in the browser" />
    <meta property="og:description" content="Scroll a shelf of hardcovers, open one, turn its pages, hold a magnifier over the print. Built with three.js, every book generated from data." />
    <meta property="og:url" content="https://othmanadi.github.io/casebound/" />
    <meta property="og:image" content="https://othmanadi.github.io/casebound/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='19' height='26' rx='2' fill='%23232a52'/%3E%3Crect x='7' y='3' width='4' height='26' fill='%23161b38'/%3E%3Crect x='14' y='9' width='9' height='2' fill='%23e9e2c8'/%3E%3Crect x='14' y='13' width='6' height='1.5' fill='%23e9e2c8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#panels">Skip to the books</a>
    <canvas id="stage" aria-hidden="true"></canvas>

    <header class="nav">
      <a class="wordmark" href="#/" id="wordmark">Casebound</a>
      <span class="nav-right">
        <a class="label" id="home-link" href="#/">&larr; Esc to shelf</a>
        <a class="label" href="https://github.com/OthmanAdi/casebound" rel="noopener">Source</a>
        <button class="label" id="theme" type="button" aria-label="Theme: light, change theme">Light</button>
      </span>
    </header>
    <p class="label section-label" id="section-label">Featured</p>
    <div class="marquee" id="marquee" aria-hidden="true"></div>

    <main id="panels"></main>
    <div class="pictures" id="pictures" aria-hidden="true"></div>
    <div class="lens-frame">
      <button class="panel-lens" id="panel-lens" type="button" aria-label="Turn on magnifier" aria-pressed="false">&#x2315;</button>
    </div>

    <footer class="bar">
      <span class="label" id="bar-title"></span>
      <span class="bar-actions">
        <button class="label" id="open" type="button">Open book [+]</button>
        <button class="label" id="details" type="button">View details [+]</button>
      </span>
    </footer>

    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Reader" hidden>
      <button class="label" type="button" id="back-many" aria-label="Ten leaves back" title="Ten leaves back as one block (Shift + left arrow). Or rest the pointer on the edge of the left page stack and click">[ &laquo; ]</button>
      <button class="label" type="button" id="prev" aria-label="Previous page">[ &larr; ]</button>
      <span class="label" id="folio" aria-live="polite"></span>
      <button class="label" type="button" id="next" aria-label="Next page">[ &rarr; ]</button>
      <button class="label" type="button" id="on-many" aria-label="Ten leaves on" title="Ten leaves on as one block (Shift + right arrow). Or rest the pointer on the edge of the right page stack and click">[ &raquo; ]</button>
      <button class="label" type="button" id="lens" aria-label="Turn on magnifier" aria-pressed="false">Lens</button>
      <span class="pens" id="pens" role="group" aria-label="Highlighter" title="Highlighter pens (H). A click takes one out or puts it back. Marks stay in the book; Ctrl + Z takes the last one away"></span>
      <button class="label" type="button" id="close" aria-label="Close book">[ X ]</button>
    </div>

    <aside class="detail" id="detail" aria-labelledby="detail-title" hidden>
      <section class="d-sec">
        <p class="label">Book</p>
        <h2 id="detail-title"></h2>
        <p class="byline" id="detail-author"></p>
      </section>
      <section class="d-sec">
        <p class="label">About</p>
        <p class="blurb" id="detail-blurb"></p>
        <div class="rows">
          <button class="row" type="button" id="row-read">Read it here <span>open</span></button>
          <a class="row" id="row-ebook" target="_blank" rel="noopener noreferrer">E-book <span>Project Gutenberg &nearr;</span></a>
          <a class="row" id="row-audio" target="_blank" rel="noopener noreferrer">Audiobook <span>LibriVox &nearr;</span></a>
        </div>
      </section>
      <section class="d-sec">
        <p class="label">Colophon</p>
        <ul class="facts" id="detail-facts"></ul>
      </section>
      <nav class="d-end" aria-label="More books">
        <button class="label" type="button" id="detail-next">Next &rarr;</button>
        <button class="label" type="button" id="detail-all">&swarr; All books</button>
      </nav>
    </aside>

    <div class="grain" aria-hidden="true"></div>
    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
